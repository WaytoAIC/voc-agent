<title>VOC 现场分析</title>

<style>
/* 布局：和 VOC 工作台同一套样式。一页讲完一个产品：结论 → 最该改的 → 用户喜欢的 → 旅程 → 行动 → 原话 */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F7F9FD; --ink:#101B31; --muted:#56657D; --faint:#8C98AD;
  --line:#DFE6F1; --accent:#2257E5; --accent-ink:#FFFFFF; --accent-soft:#E8EEFF;
  --good:#17895B; --good-soft:#E3F5EC; --warn:#B07800; --warn-soft:#FBF1D9; --bad:#C93A31; --bad-soft:#FCE7E5;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#121A2C; --surface-2:#0F1626; --ink:#E7ECF6; --muted:#9AA7BE; --faint:#6E7A91;
  --line:#233049; --accent:#7096FF; --accent-ink:#0B1120; --accent-soft:#1A2849;
  --good:#43C28C; --good-soft:#123426; --warn:#E3AE44; --warn-soft:#3A2D10; --bad:#F2726A; --bad-soft:#3D1A18; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#121A2C; --surface-2:#0F1626; --ink:#E7ECF6; --muted:#9AA7BE; --faint:#6E7A91;
  --line:#233049; --accent:#7096FF; --accent-ink:#0B1120; --accent-soft:#1A2849;
  --good:#43C28C; --good-soft:#123426; --warn:#E3AE44; --warn-soft:#3A2D10; --bad:#F2726A; --bad-soft:#3D1A18; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0;align-content:start;animation:rise .32s var(--ease) both}
.panel h2{font-size:16px}
.sub{color:var(--muted);font-size:13px;margin:0}
.hint{font-size:12px;color:var(--faint)}
.row2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.hero img{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
.hero h1{font-size:clamp(20px,2.6vw,26px);font-weight:700}
.hero .en{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.stats span{white-space:nowrap} .stats b{color:var(--ink);font-family:var(--font-num)}
.summary{font-size:16px;font-weight:700;line-height:1.55;border-left:4px solid var(--accent);padding:4px 0 4px 12px}
.insight{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--muted)} .kpi b{font-size:22px;font-family:var(--font-num)} .kpi small{font-size:12px;color:var(--faint)}
.stars{display:grid;gap:4px}
.srow{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left;animation:grow .56s var(--ease) both}
.item{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.ih{display:grid;grid-template-columns:24px minmax(0,1fr) 120px 64px;gap:10px;align-items:center}
.rank{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.ih b{display:block} .ih small{display:block;font-size:12px;color:var(--muted)}
.fix{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:grid;gap:2px}
.quote .en{font-size:13px} .quote .zh{font-size:12.5px;color:var(--muted)} .quote .src{font-size:11.5px;color:var(--faint)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
details[open] summary{margin-bottom:6px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:720px;height:auto}
.chart text{font-family:var(--font-body)}
.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.act p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px;transition:background-color .12s,border-color .12s}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
td .zh{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.foot{font-size:12px;color:var(--faint);text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.jline{stroke-dasharray:1;stroke-dashoffset:1;animation:jdraw .9s var(--ease) .2s forwards}
@keyframes jdraw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.jline{stroke-dasharray:none;stroke-dashoffset:0}}
</style>

"好看", "好装"]}, {"star": 5, "t": 1777478400000, "sku": "15 片", "vine": false, "verified": true, "en": "Good quality, easy installation. I do recommend these.", "zh": "质量好，好装，推荐。", "tags": ["好装"]}, {"star": 5, "t": 1777392000000, "sku": "15 片", "vine": false, "verified": true, "en": "Film is easy to peel, however there's a certain way to pull or it is easy to rip and then it's miserable trying to take off the film. Corners loft up slightly but they do give you a roll of tape. They feel great, they look great.", "zh": "膜要按对方向撕，不然容易撕破，残膜很难抠。四角有点翘，盒里给了一卷胶带。脚感和样子都好。", "tags": ["背膜难撕", "边角翘、粘不住", "好看", "好装"]}, {"star": 5, "t": 1776700800000, "sku": "7 片", "vine": false, "verified": true, "en": "The plastic backing absolutely sucks to take off. The best way is to tear it down the middle and pull from the middle to the sides. These stair treads are not sticky enough on their own to effectively stay down. In the box was a small roll of adhesive tape. You will need it. There is not enough extra tape to do a strip along each edge.", "zh": "背膜真的难撕，要从中间撕开往两边拉。自己粘不牢，盒里那一小卷胶带一定要用，每个角贴一点；不够每条边都贴，多给一卷就好了。", "tags": ["背膜难撕", "边角翘、粘不住", "好看", "比定制便宜"]}, {"star": 1, "t": 1775491200000, "sku": "31×31 落地垫", "vine": false, "verified": true, "en": "These look very nice but they are NOT washable. So, with kids and pets, this product is not the best product.", "zh": "好看但不能洗。家里有孩子和宠物就不合适。", "tags": ["不能洗"]}, {"star": 5, "t": 1774713600000, "sku": "15 片", "vine": false, "verified": true, "en": "Our dog was scared to death and slipped and fell a lot. These worked out great. Took a couple of weeks to get the crease out of them because they were shipped folded in half. Might want to consider shipping flat.", "zh": "狗之前怕得要命、老摔，现在没问题了。折着发货，折痕两周才平，建议平着寄。", "tags": ["宠物不再打滑", "运输折痕"]}, {"star": 1, "t": 1774627200000, "sku": "15 片", "vine": false, "verified": true, "en": "The mats themselves are pretty nice, but half of the mats in my order came with the backing already peeled off and dirty. You'll be getting someone's half-used return.", "zh": "垫子本身不错，但一半背膜已经撕开还脏了。收到的是别人用过退回的货。", "tags": ["收到二手货"]}, {"star": 5, "t": 1773417600000, "sku": "15 片", "vine": false, "verified": true, "en": "It took about 15 minutes to take the backing off. I was fearful that the stickiness wouldn't keep the tread in place. However it's stuck on firmly. I installed these to prevent my 90lb Labrador from slipping down the staircase.", "zh": "撕背膜花了 15 分钟。本来担心粘不住，结果很牢。为了 90 磅的拉布拉多不再滑下楼梯买的。", "tags": ["宠物不再打滑", "好装", "好看"]}, {"star": 5, "t": 1772726400000, "sku": "15 片", "vine": false, "verified": true, "en": "Fits well and looks really nice. May need some additional glue.", "zh": "尺寸合适，很好看。可能需要再加点胶。", "tags": ["好看", "边角翘、粘不住"]}, {"star": 5, "t": 1772380800000, "sku": "15 片", "vine": false, "verified": true, "en": "These are great! I did buy extra adhesive tape to install but they stay in place and look great!", "zh": "很棒！另买了胶带来装，贴住了，很好看。", "tags": ["边角翘、粘不住", "好看"]}, {"star": 5, "t": 1771689600000, "sku": "15 片", "vine": false, "verified": true, "en": "Very nice", "zh": "很好", "tags": []}, {"star": 5, "t": 1770825600000, "sku": "15 片", "vine": false, "verified": true, "en": "Perfect color for my stairwell. Easy to place on the stairs. Run an exacto knife lightly around the edge so the clear film on the back comes cleanly.", "zh": "颜色正合适，好放。建议先用美工刀沿边轻划一圈，背面透明膜就能撕干净。", "tags": ["好看", "好装", "背膜难撕"]}, {"star": 1, "t": 1770566400000, "sku": "15 片", "vine": false, "verified": true, "en": "pretty but not durable", "zh": "好看但不耐用", "tags": ["不耐用、偏薄", "好看"]}, {"star": 4, "t": 1769443200000, "sku": "7 片", "vine": false, "verified": true, "en": "They look even better than expected! Took off one star because it's been hard to get the corners to really stick down well, but they make our wood steps feel much safer.", "zh": "比预期还好看。扣一星是四角很难贴牢。木楼梯走着安全多了。", "tags": ["好看", "边角翘、粘不住", "防滑安心"]}, {"star": 5, "t": 1764864000000, "sku": "15 片", "vine": false, "verified": true, "en": "They have been on for just ove {"tag": "尺寸偏小", "reviews": 1, "ofReviews": 2.9, "alexa": 0}, {"tag": "不能洗", "reviews": 1, "ofReviews": 2.9, "alexa": 5}, {"tag": "伤地板", "reviews": 1, "ofReviews": 2.9, "alexa": 5}, {"tag": "收到二手货", "reviews": 1, "ofReviews": 2.9, "alexa": 4}], "topCovered": 3, "topN": 3, "missed": [], "alexaOnly": []}}, "alexa": {"items": [{"q": "What are the most common complaints in the negative reviews for this product?", "category": "核心必问", "answer": "Based on reviews of the MontVoo 15PC Jute Stair Treads, here are the most common complaints from lower-rated reviews:Adhesion Issues — The most frequently cited problem. Reviewers report the treads not sticking properly, with insufficient adhesive tape and difficulty keeping corners in place. Some note they had to purchase additional tape for better results.Durability Concerns — Several reviewers report the product damaging their floors within days or weeks, and others mention the adhesive film being easy to tear during installation, making removal difficult.Creasing Problems — Because the treads arrive folded in half for shipping, customers struggle to remove center creases. Some report it takes weeks for the wrinkles to smooth out.Quality Inconsistencies — A few reviewers received treads with the backing already peeled off and damaged upon arrival.On a positive note, even critical reviewers acknowledge the attractive appearance and good slip resistance when they do adhere properly. The product has a 4.2-star rating with 131 total reviews (22% rated 1-3 stars).Would you like to know more about adhesion solutions or see alternative stair tread options?", "zh": "差评里最常见的抱怨：粘不住、四角翘（最多），其次是伤地板、背膜易撕破、折痕、收到背膜已撕开的货；差评也承认好看、防滑。", "tags": ["边角翘、粘不住", "伤地板", "背膜难撕", "运输折痕", "收到二手货", "好看", "防滑安心"], "stance": "一致"}, {"q": "What specific defects or quality failures do 1-star and 2-star reviewers report?", "category": "核心必问", "answer": "15% of 131 total ratings are 1-2 stars. Based on the detailed feedback available, here are the specific defects and quality failures 1-2 star reviewers report for the MontVoo 15PC Jute Stair Treads:Adhesion Failures — The most critical defect. Reviewers report the self-adhesive backing not sticking properly, with insufficient adhesive tape coverage and corners lifting or peeling off entirely. One reviewer stated they were \"totally regretting it waste of my money they do not stick.\"Durability & Material Quality — Multiple defects reported:\n•Thin, low-quality construction that tears easily during removal of the backing film, making the product miserable to install\n•The adhesive film itself is easy to rip, complicating removal\n•Damage to underlying floors within days to a week of installation\n•Some units arriving with the backing already peeled off and dirty upon arrival\nCreasing Problems — Because treads ship folded in half, reviewers struggle to remove center creases, with some reporting it takes weeks for wrinkles to smooth out—or they never do.Installation Issues — Reviewers mention difficulty peeling the plastic backing film and overall challenging installation despite marketing claims of ease.The product is marked as \"frequently returned,\" which aligns with these quality and adhesion failures reported in lower-rated reviews.", "zh": "1–2 星占 15%。具体缺陷：粘不住、偏薄易撕、背膜难撕、一周内伤地板、收到背膜已撕开且脏的货、折痕难平。", "tags": ["边角翘、粘不住", "不耐用、偏薄", "背膜难撕", "伤地板", "收到二手货", "运输折痕"], "stance": "一致"}, {"q": "Do customers feel the listing photos or description are misleading versus what arrived?", "category": "核心必问", "answer": "Based on available reviews, customers don't specifically mention the listing photos or description being misleading. However, there are notable gaps between what the product promises and what customers experience:Adhesion Claims vs. Reality — The listing emphasizes \"easy installation\" and \"self-adhesive backing,\" but reviewers repeatedly report the adhesive is insufficient. One customer states the product is \"supposed to be self stick, what a joke.. it is not sticky at all,\" while another notes \"there is not enough extra adhesive tape to do a strip along each edge.\"\"Residue-Free Removal\" Claim — The description claims \"residue-free removal,\" but several reviewers report the backing film tears during removal and is \"miserable trying to take off.\" Some mention the product damaged their floors within days.\"Easy Installation\" Claim — While some reviewers confirm installation is quick (20-30 minutes), others struggle significantly with peeling the plastic backing film, suggesting the description may understate installation difficulty for some users.Customers don't appear to reference the photos being inaccurate, but the marketing language around adhesive strength and ease of removal doesn't align with the experiences reported in critical reviews.", "zh": "没人说图片或描述误导，但「自粘、好装、无残胶」这几个卖点和实际体验有落差。", "tags": ["边角翘、粘不住", "背膜难撕", "伤地板"], "stance": "补充"}, {"q": "How soon do customers say this product breaks, wears out, or stops working?", "category": "核心必问", "answer": "Based on customer reviews, the MontVoo Jute Stair Treads shows mixed longevity:Positive Long-Term Reports — Some customers report excellent durability over extended use. One reviewer states \"The adhesive has held up well — it's been there for months now and no issues,\" and another reports \"No issues whatsoever and we've had them installed for over 6 months with heavy traffic and several large animals.\"Early Failure Timeline — However, critical reviewers report problems within days to weeks:\n•Within 1 week: One customer notes the product \"damaged the floor in a week\"\n•During installation: Several mention the backing film tears easily, making removal difficult\n•Adhesion failures: Corners and edges often begin lifting within the first few weeks as the self-adhesive weakens\nThe key differentiator appears to be adhesion quality — customers who reinforce the adhesive with extra tape report months of trouble-free use, while those relying solely on the original adhesive often see corner peeling and failure within 2-4 weeks.The product is marked \"Frequently returned,\" which aligns with these early durability issues reported in reviews.", "zh": "寿命两极：有人用了 6 个多月没问题；差评说几天到几周就出问题，四角 2–4 周开始翘。另外提到页面标了「Frequently returned item」。", "tags": ["边角翘、粘不住", "伤地板", "用得住"], "stance": "补充"}, {"q": "What do customers love most about this product?", "category": "核心必问", "answer": "Customers love several standout features of the MontVoo Jute Stair Treads:Appearance — Reviews consistently highlight how attractive the natural jute material looks. Customers mention they \"look great,\" \"look beautiful,\" and add a refined, elegant aesthetic to their stairs that complements various home décors.Slip Resistance & Safety — Multiple customers emphasize excellent traction, with one noting \"the safety that they offer to our previously slippery bare hardwood steps is unsurpassed.\" Pet owners particularly love that these help elderly or struggling dogs navigate stairs safely.Quality & Feel — When adhesion works well, customers praise the sturdy construction, finding them \"nice quality\" and noting they \"feel good\" underfoot with a solid, textured surface.Pet-Friendly Design — Customers with dogs and cats love that the jute resists scratching (unlike plush fabrics) and doesn't trap pet hair, making maintenance easier.Stability — When properly adhered, reviewers report they \"don't move out of place\" and stay put through regular use and pet traffic.Value — Customers who get good adhesion feel the price is fair for natural material stair treads that look premium in their homes.The consistent theme: customers love what they do (look beautiful, provide safety, resist pet damage) — the main frustration centers on the adhesive backing, not the treads themselves.Would you like solutions for strengthening the adhesion?", "zh": "用户最爱：好看、防滑安全（尤其老年犬）、质感好、防宠物抓挠、贴牢后不移位。", "tags": ["好看", "防滑安心", "宠物不再打滑"], "stance": "一致"}, {"q": "Which features or qualities are praised most often in 5-star reviews?", "category": "核心必问", "answer": "The MontVoo 15PC Jute Stair Treads has 131 total ratings — 66% 5-star, 12% 4-star, and 22% 1-3 star. The product doesn't have enough written reviews at the 5-star rating level to extract specific themes, but based on all customer feedback, here's what reviewers at higher ratings consistently praise:What 5-star and 4-star reviewers love most:\n•Appearance (17 mentions, 100% positive): Customers consistently highlight how attractive and elegant the natural jute looks. Reviewers mention they \"look great,\" \"look beautiful,\" and add a refined aesthetic to their home. — \"Looks beautiful, great quality and easy installation.\"\n•Slip Resistance & Safety (10 mentions, 83% positive): Reviewers emphasize excellent traction on previously slippery wooden stairs. Pet owners particularly praise how well these help elderly or struggling dogs navigate safely. — \"These are attractive and amazingly slip resistant. The safety that they offer to our previously slippery bare hardwood steps is unsurpassed.\"\n•Quality & Feel (20 mentions, 80% positive): Customers praise the sturdy, well-made construction and solid feel underfoot when the treads stay properly adhered. — \"Looks beautiful, great quality and easy installation.\"\n•Stability (7 mentions, 100% positive): When adhesion works, reviewers report the treads stay perfectly in place without shifting through regular use and heavy traffic. — \"They didn't move out of place.\"\nSee all reviews ›The standout takeaway: buyers who rate this 5 stars love how it looks and performs for safety, but their satisfaction hinges entirely on whether the adhesive holds.", "zh": "评分 131 个：5 星 66%、4 星 12%、1–3 星 22%。好评主题：外观 17 次全正面，防滑 10 次 83% 正面，质感 20 次 80% 正面。", "tags": ["好看", "防滑安心"], "stance": "补充"}, {"q": "What materials is this product made of, and how is the build quality?", "category": "核心必问", "answer": "The MontVoo Jute Stair Treads are made of tightly woven natural jute, which gives them a refined, textured appearance and good slip resistance.Build Quality — Mixed Feedback:Strengths:\n•Sturdy construction — Customers who keep them report they feel solid and well-made\n•Pet-resistant jute — Unlike plush fabrics, the dense weave resists scratches from claws and doesn't trap pet hair\n•Durable material — When properly adhered, the jute itself holds up well to regular foot traffic\nConcerns:\n•Thin material — Some reviewers note the jute feels thinner than expected, making the backing film easy to tear during removal\n•Adhesive backing weakness — The main quality issue isn't the jute itself but the self-adhesive layer, which reviewers frequently report as insufficient (not enough coverage at corners and edges)\n•Shipping damage — A few customers report treads arriving with backing already peeled off or dirty\n•Creasing — Because they ship folded, creases are difficult to remove and can take weeks to disappear\nCustomer consensus: The jute material and craftsmanship are good for the price, but build quality is compromised by weak adhesive backing. Many customers add extra carpet tape to reinforce it.The product is marked \"Frequently returned,\" largely due to adhesion failures rather than material defects.", "zh": "材质是天然黄麻，做工评价两极：黄麻本身结实，问题出在背胶不够和偏薄；另有运输折痕、收到已撕背膜的货。", "tags": ["不耐用、偏薄", "边角翘、粘不住", "运输折痕", "收到二手货"], "stance": "一致"}, {"q": "How durable is it over months of regular use, according to reviews?", "category": "核心必问", "answer": "Durability over months — Mixed Results:The MontVoo Jute Stair Treads show highly variable durability depending on adhesion quality:Long-Term Success (Months):\n•Customers who reinforce adhesion with extra carpet tape report excellent durability — one reviewer states \"The adhesive has held up well — it's been there for months now and no issues,\" and another notes \"We've had them installed for over 6 months with heavy traffic and several large animals\"\n•When properly adhered, the jute material itself resists wear from foot traffic and pet claws\nEarly Failure Timeline:\n•Corners lifting within 2–4 weeks as original adhesive weakens\n•Peeling edges often begin failing by week 3–4 with regular use\n•Some report floor damage within 1 week if adhesive fails and backing residue remains\nThe Key Factor: Durability hinges entirely on the self-adhesive backing — the jute material is durable, but insufficient adhesive coverage is the failure point. Reviews show customers who add carpet tape along edges achieve multi-month stability, while those relying on original adhesive often need replacement within weeks.The product is marked \"Frequently returned,\" reflecting these early adhesion failures rather than material defects.Interested in solutions to extend durability?", "zh": "耐用性全看背胶：另加胶带的人用了几个月没问题，只靠原胶的 2–4 周四角开始翘。", "tags": ["边角翘、粘不住", "用得住"], "stance": "一致"}, {"q": "What are the main features and selling points of this product?", "category": "核心必问", "answer": "The MontVoo 15PC Jute Stair Treads combines natural aesthetics with practical safety features:Key Selling Points:\n•Natural Jute Material — Tightly woven jute adds elegant, refined look while reducing noise on stairs\n•Non-Slip Surface — Excellent traction helps prevent slips on wooden stairs; customers particularly praise the safety for elderly pets and children\n•Pet-Friendly — Resists scratches from claws and prevents pet hair from getting trapped (unlike plush carpet treads)\n•Peel-and-Stick Installation — Easy application with transparent backing film and guide stickers; no tools needed\n•Residue-Free Removal — Self-adhesive backing can be removed cleanly without damaging floors or leaving sticky residue\n•15-Piece Set — Covers 15 stairs at 8\"×30\" per tread\n•Price — $69.98 for the 15-pack; customers find it good value for natural materials\nWhat Customers Love Most:\n•Appearance (100% positive mentions) — looks beautiful and elegant\n•Slip resistance and safety (83% positive)\n•Build quality (80% positive)\n•Stability when properly adhered (100% positive)\nMain Consideration: Adhesion is the primary tradeoff — customers consistently reinforce with extra carpet tape for long-term durability (6+ months), while those relying on original adhesive often see corner peeling within 2–4 weeks. The product is marked \"Frequently returned\" due to adhesion concerns.", "zh": "卖点归纳：天然黄麻、防滑、防宠物、免工具自粘、无残胶、15 片装 $69.98；最需要注意的是粘性。", "tags": ["好看", "防滑安心", "好装", "边角翘、粘不住"], "stance": "补充"}, {"q": "Which advertised features actually work well in real use, and which disappoint?", "category": "核心必问", "answer": "What Works Well in Real Use:\n•Appearance (100% positive) — The natural jute looks elegant and refined; customers consistently say it looks \"beautiful\" and \"great\" on stairs\n•Slip Resistance & Safety (83% positive) — Delivers excellent traction; customers report it \"prevents slips\" and helps elderly pets navigate safely\n•Quality Material (80% positive) — Jute is sturdy and feels good underfoot; resists pet scratches and doesn't trap hair like plush alternatives\n•Stability (100% positive) — When adhesion holds, treads stay completely in place with no shifting during regular use\n•Easy Removal (advertised) — Comes off cleanly without floor damage when the backing film cooperates\nWhat Disappoints in Real Use:\n•Adhesion (44% positive, 56% negative) — The self-adhesive backing is the main failure point: corners and edges lift within 2–4 weeks; not enough adhesive coverage despite advertising \"reliable self-adhesive backing\"\n•Backing Film Removal (challenging) — Customers report peeling the plastic backing is difficult and can tear easily, contradicting the \"easy installation\" claim\n•Thin Material — The jute feels thinner than expected, making it easier to damage during installation\n•Creasing (60% negative) — Ships folded, creating permanent creases that take weeks to disappear\n•Durability (80% negative) — Despite durability claims, adhesion failures cause early deterioration; some customers report floor damage within a week if adhesive fails\nBottom Line: The product delivers on appearance, safety, and material quality — but fails on its core promise of reliable self-adhesive backing. Most satisfied customers reinforce with extra carpet tape, effectively completing what the adhesive should do alone.Interested in adhesion solutions that actually work?", "zh": "名不副实的卖点：粘性（正面 44%、负面 56%）和「好装」；名副其实的：外观、防滑、质感、贴牢后稳定。", "tags": ["边角翘、粘不住", "背膜难撕", "好看", "防滑安心"], "stance": "一致"}, {"q": "How easy is this product to set up and start using?", "category": "核心必问", "answer": "Installation is generally easy but has a significant catch:The MontVoo Jute Stair Treads are designed for simple peel-and-stick application with helpful features:\n•Transparent backing film with center slit and guide stickers marking where to peel\n•No tools needed — just peel, position, and press down\n•Quick timing — one customer completed 12 stairs in 20 minutes\n•Residue-free removal — comes off cleanly if you need to reposition\nWhere Setup Gets Tricky:\n•Peeling the backing film is the main frustration — customers report the plastic backing is difficult and easy to tear, with some describing it as \"miserable\" to remove; one reviewer said \"removing the plastic backing SUCKED\"\n•Corners require extra care — adhesion is weak at edges, so many customers add extra carpet tape during installation for proper hold\n•Creases from shipping — arrives folded, creating creases that take 1–2 weeks to disappear and make installation harder\nReal-World Experience:\nMost satisfied customers report \"easy installation\" when they come prepared with extra carpet tape. Without reinforcement, adhesion failures happen quickly (within 2–4 weeks), requiring reinstallation.The product advertises \"easy installation,\" but customers consistently mention needing extra materials and effort beyond what the product provides.", "zh": "安装总体简单（12 级 20 分钟），但背膜难撕、四角要另加胶带、折痕要 1–2 周才平。", "tags": ["好装", "背膜难撕", "边角翘、粘不住", "运输折痕"], "stance": "一致"}, {"q": "What do customers find confusing or frustrating when first using it?", "category": "核心必问", "answer": "Most Common Frustrations When First Using:1. Peeling the Backing Film (cited most frequently)\n•Customers describe this as \"miserable,\" \"challenging,\" and the worst part of installation\n•The transparent plastic backing tears easily if you pull the wrong way\n•One reviewer said: \"Removing the plastic backing SUCKED\"\n•Tip: Go slowly, use your fingernail carefully, and follow the guide stickers marked on the film\n2. Weak Adhesion at Corners & Edges\n•Corners don't stick down properly despite claims of \"reliable self-adhesive backing\"\n•Customers report needing to add extra carpet tape right from installation to make treads stay\n•One reviewer noted: \"Took off one star because it's hard to get the corners to really stick down well\"\n3. Creasing from Shipping\n•Arrives folded in half, creating deep creases down the middle\n•Takes 1–2 weeks to flatten, making initial installation frustrating\n•Makes the treads harder to position properly during setup\n4. Unclear Expectations\n•Customers expecting the advertised \"easy installation\" and \"reliable self-adhesive backing\" find they need extra supplies and effort beyond what the product provides\n•Some are surprised the jute feels thinner than anticipated\n5. Shipping Damage\n•A few customers report treads arriving with backing already peeled off or dirty\nBottom Line: The frustration isn't the jute quality or appearance—it's the gap between what's advertised (easy peel-and-stick) and what's needed in practice (extra tape, careful backing removal, crease patience).", "zh": "初次使用最烦的：撕背膜（最多）、四角粘不住、折痕、预期落差。", "tags": ["背膜难撕", "边角翘、粘不住", "运输折痕"], "stance": "一致"}, {"q": "What are the exact dimensions, weight, and capacity of this product?", "category": "核心必问", "answer": "Dimensions & Weight for the MontVoo 15PC Jute Stair Treads:Individual Tread Dimens ct by buyer type:\n•Worth it if: You specifically want natural jute aesthetics and are willing to buy extra tape\n•Not worth it if: You want reliable adhesion, washability, or long-term durability — comparable or better-rated options like MBIGM ($41.99) and TranquilMoments ($29.96) cost significantly less with stronger track records", "zh": "值不值：偏谨慎的正面。想要天然黄麻的人觉得值；但要另买胶带，且页面标了高退货。", "tags": ["比定制便宜", "边角翘、粘不住"], "stance": "补充"}, {"q": "Who is this product best suited for, and who should avoid it?", "category": "核心必问", "answer": "Best suited for:\n•Design-focused homeowners — If natural jute aesthetics matter more than durability or convenience, this is the standout choice. Customers consistently praise how elegant and refined it looks\n•Pet owners (selective) — The dense jute weave resists scratching and minimizes pet hair buildup. Customers report it \"works great\" for elderly dogs who struggle on hardwood stairs\n•Buyers willing to invest in extras — If you're prepared to purchase additional carpet tape upfront (many reviews mention buying extra), adhesion becomes manageable\n•Low-traffic staircases — Works best on stairs with moderate use, not high-traffic households\nShould avoid if:\n•You need reliable, no-fuss adhesion — Corners regularly don't stick, and reviews show mixed experiences. Competing options like COSY HOMEER ($76.49, 4.7★) and MBIGM ($41.99, 4.6★) have TPE/TPR backing that grips without adhesive tape headaches\n•You need washability — These cannot be machine washed (only vacuum/damp cloth). All competing products are fully washable, a major advantage for pet homes\n•You're budget-conscious — At $69.98 with durability concerns flagged, you'll get better value from TranquilMoments ($29.96, 4.5★) or MBIGM ($41.99, 4.6★)\n•You want long-term durability proof — MontVoo is a newer product (August 2025) with reports of floor damage within a week. Top alternatives have years of verified buyer data\n•You have high-traffic stairs or young children/pets — T  MBIGM ($41.99, 4.6★ with 8,755 reviews) and TranquilMoments ($29.96, 4.5★) cost much less with proven durability\n6. Missing Adhesive Tape\n•Half of buyers report the adhesive isn't strong enough from the factory\n•Customers expect the product to arrive \"ready to install\" but end up buying supplementary tape\nBottom line: Shoppers hesitate because this is a newer product with a \"frequently returned\" flag, unresolved adhesion issues, and durability concerns — yet it costs more than established alternatives with better reviews.", "zh": "让买家犹豫的：粘不住（第一）、高退货标记、伤地板、折痕、不能机洗、上架时间短。", "tags": ["边角翘、粘不住", "伤地板", "运输折痕", "不能洗"], "stance": "补充"}, {"q": "What do customers wish they had known before buying it?", "category": "核心必问", "answer": "Based on customer reviews, here's what shoppers wish they had known before buying the MontVoo Jute Stair Treads:1. Adhesion Requires Extra Tape (The #1 Regret)\n•Customers repeatedly say: \"I wish I had known to buy extra adhesive tape upfront\"\n•Reviews mention \"corners don't stick well\" and \"adhesion is not enough\" — plan to spend extra on carpet tape or expect them to peel up over time\n•One customer notes: \"These worked great. I read reviews of others and got more carpet tape to take down\" — meaning experienced buyers know the workaround\n2. Creases Are Permanent\n•Shipped folded in half, leaving center creases that take 1–2 weeks to flatten — some customers say they never fully disappear\n•One buyer: \"Took a couple of weeks to get the crease out... consider shipping flat\"\n•This affects both appearance and adhesion, especially in the creased areas\n3. Removing the Plastic Backing Is Frustrating\n•Multiple customers describe this as surprisingly difficult: \"removing the plastic backing SUCKED\" and \"there's a certain way to pull or it is easy to rip\"\n•Ripping the backing creates holes in the jute, ruining the tread\n4. Floor Damage Risk\n•One customer reported: \"Damaged the floor in a week\" — a serious concern not mentioned in product descriptions\n•Customers wished they knew about this potential risk before installation\n5. The \"Washable\" Claim Is Misleading\n•Product title says \"Washable\" but they're not machine washable — only vacuum or damp cloth\n•Customers with pets felt misled by this marketing claim\n6. Limited Long-Term Durability Data\n•This is a newer product (August 2025) — customers wish they had known it lacks the 2+ year track record of established alternatives\n•One buyer: \"Spend a little more money and get a better quality product\"\n7. Not Ideal for High-Traffic Stairs\n•Customers report that vacuuming can cause peeling over time — wish they'd known this before buying for busy households\nWhat Satisfied Buyers Knew Upfront:\n•They bought extra carpet tape before installation\n•They understood this was a natural jute product requiring careful handling\n•They had realistic expectations about creasing and took time to flatten them\n•They understood the washability limitation", "zh": "买家后悔没早知道的：要提前买胶带（第一）、折痕要很久才平、背膜难撕。", "tags": ["边角翘、粘不住", "运输折痕", "背膜难撕"], "stance": "一致"}, {"q": "What warranty does it come with, and how is the seller's customer service?", "category": "核心必问", "answer": "The MontVoo Jute Stair Treads product page does not specify a warranty — this is an important gap. The product description mentions \"Residue-Free Removal\" and \"easy replacement,\" but there's no written warranty coverage or protection period listed.What we know about the seller (MontVoo):\n•No warranty information available on the product page\n•Seller responsiveness: Customer reviews don't directly mention seller communication or support responses\n•Return support: The product is flagged as a \"Frequently returned item\" on Amazon, suggesting customers are exercising the standard Amazon return window rather than relying on manufacturer warranty\nWhat this means for you:\n•You'll likely rely on Amazon's standard return policy (typically 30 days for most items, extended during the holiday season) rather than a manufacturer warranty\n•For defects or adhesion failures, your recourse would be through Amazon returns, not the seller directly\n•Several customers report issues (adhesion failure, floor damage) but reviews don't indicate warranty claims — they appear to have returned items instead\nComparison with alternatives:\n•COSY HOMEER (4.7★, 8,728 reviews) and MBIGM (4.6★, 8,755 reviews) also don't advertise extended warranties, but their high review counts and lower return rates suggest better peace of mind\nRecommendation: Before purchasing, contact MontVoo through Amazon's messaging system (if available) to ask about warranty coverage, especially given the adhesion concerns and durability issues reported by other customers.", "zh": "页面没写质保；售后靠亚马逊退货，结合高退货标记，大家是直接退货而不是找卖家。", "tags": [], "stance": "补充"}, {"q": "Do customers report shipping damage, missing parts, or packaging problems?", "category": "核心必问", "answer": "Yes, customers report specific shipping and packaging issues with the MontVoo Jute Stair Treads:Shipping Damage & Condition Issues:\n•Pre-peeled backing — Multiple customers report: \"half of the mats in my order came with the backing already peeled off and dirty\" — some even mention visible debris like dead bugs on the adhesive side\n•Center creases (shipped folded) — All 15 treads arrive folded in half, creating permanent center creases that take 1–2 weeks to flatten and may never fully disappear\n•Film removal damage — The plastic backing film is difficult to remove without tearing: \"removing the plastic backing SUCKED\" and \"there's a certain way to pull or it is easy to rip\"\nMissing Parts:\n•No reports of completely missing treads in shipments, but the pre-peeled backing issue effectively renders some treads unusable or already compromised\nPackaging Problem:\n•Shipping flat design needed — Customers consistently suggest: \"Might want to consider shipping flat\" instead of folded, as this would eliminate creasing damage entirely\nWhat This Means:\n•Before installation, expect to inspect all 15 treads for pre-peeled or dirty backing\n•Plan 1–2 weeks for creases to flatten (they may not fully disappear)\n•Budget extra time for careful film removal to avoid tearing and damaging the jute\nCompared to alternatives like MBIGM and TranquilMoments, which don't report these packing issues as frequently, MontVoo's folded shipping is a clear design flaw affecting customer satisfaction before installation even begins.", "zh": "运输问题：有人收到背膜已撕开、还脏的货；全部折叠发货有折痕；没人说少件。", "tags": ["收到二手货", "运输折痕"], "stance": "一致"}, {"q": "What is this brand's reputation, and do buyers trust it?", "category": "核心必问", "answer": "MontVoo's Reputation: Mixed to CautiousBased on customer feedback and product signals, here's what buyers should know:Trust Level: Moderate — Proceed with CautionPositive Signals:\n•Customers consistently praise aesthetics and design — \"looks great,\" \"elegant jute finish,\" \"refined look\"\n•Stability for pets: Elderly and mobility-limited dogs do well on these treads\n•Quality feel: Most describe them as \"good quality\" jute material with solid construction\n•No major complaints about false advertising or misleading product claims\nRed Flags (Trust Concerns):\n•\"Frequently returned item\" flag — Amazon's clearest indicator of durability/satisfaction problems\n•Brand age: MontVoo launched this product August 2025 (just 14 months ago) — customers cannot yet verify long-term durability\n•Adhesion inconsistency: Mixed experiences suggest quality control issues — some buyers get strong adhesion, others report immediate corner failures\n•Packaging issues: Pre-peeled backing and shipping creases suggest operational challenges, not just product design flaws\n•No transparency on warranty or customer service — no visible seller communication or support infrastructure mentioned in reviews\nWhat Customers Say About Trust:\n•Satisfied buyers note: \"I did buy extra adhesive tape to install\" — suggesting experienced customers expect limitations and self-solve\n•Frustrated buyers: \"Spend a little more money and get a better quality product. Would not buy again\" — indicating MontVoo isn't seen as a premium, reliable brand\n•One customer reported floor damage within a week — a serious red flag for brand reliability\nComparison to Established Competitors:\n•MBIGM (8,755 reviews, 4.6★) and COSY HOMEER (8,728 reviews, 4.7★) have 3–4x more reviews and higher consistency\n•These brands have 2+ years of proven track records; MontVoo doesn't yet\nBottom Line on Brand Trust:\n•MontVoo is a newer, design-focused brand — excellent for aesthetics, unproven for durability\n•Buy only if you're willing to add extra adhesive tape and accept potential adhesion inconsistency\n•For peace of mind and proven reliability, established brands like MBIGM and COSY HOMEER are safer choices", "zh": "品牌口碑：谨慎。好看、质感好；但高退货标记、上架才 14 个月、粘性不稳定像品控问题、没写质保。", "tags": ["好看", "边角翘、粘不住"], "stance": "补充"}, {"q": "What improvements do customers most often wish this product had?", "category": "核心必问", "answer": "Customers wish the MontVoo Jute Stair Treads had these key improvements:1. Stronger, Full-Coverage Adhesion (Most Common Wish)\n•\"Adhesion all the way to the corners\" — The #1 request; corners routinely peel up with foot traffic and vacuuming\n•Customers want factory-strength adhesive that doesn't require buying supplementary tape\n•One buyer: \"These are nice, feel good too, just wish the adhesive went all the way to corners\"\n2. Flat Shipping (Not Folded)\n•Multiple customers: \"Might want to consider shipping flat\" instead of folded in half\n•Permanent center creases take 1–2 weeks to flatten and may never fully disappear\n•This single change would eliminate a major pain point\n3. Machine-Washable Option\n•Product title claims \"Washable\" but only vacuum/damp cloth allowed — customers feel misled\n•Pet owners specifically wish for machine-washable versions for easy cleaning after accidents or shedding\n4. Better Plastic Film Removal System\n•Customers describe removing the backing as frustrating and easy to tear\n•Wish: A more intuitive peeling mechanism that doesn't risk ripping the jute\n5. Lighter Color Variation Options\n•While \"natural color variation\" is expected with jute, some customers received darker treads than shown in photos\n•Wish: More consistency or the option to choose lighter/darker shades\n6. Protective Flooring Guidance\n•One customer reported floor damage within a week\n•Wish: Clear warnings about potential floor damage risks with certain finishes and floor types\n7. Better Quality Control on Pre-Installation\n•Half of some orders arrived with backing already peeled off and dirty\n•Wish: 100% inspection before shipping to ensure all treads are pristine on arrival\nWhat This Tells You:\nThese aren't fundamental design flaws — they're refinable issues. Competitors like TranquilMoments ($29.96) address some of these with better adhesion and washability, while MBIGM ($41.99) offers lower cost with proven durability over 3+ years.", "zh": "最希望改进：胶贴到四角（第一）、平着发货、可机洗、背膜更好撕。还说标题写了「Washable」，实际标题里没有。", "tags": ["边角翘、粘不住", "运输折痕", "不能洗", "背膜难撕"], "stance": "有误"}], "findings": [{"kind": "一致", "text": "Alexa 也把「粘不住、四角翘」排第一，并告诉买家「最好提前另买胶带」", "why": "评论里 34 条有 12 条在说；24 题里有 18 题的回答提到它。买家在商品页问 Alexa 时，第一句听到的就是这个问题"}, {"kind": "补充", "text": "商品页被标了「Frequently returned item」（高退货）", "why": "评论里看不到这个标记，Alexa 在 11 道题的回答里都提到了，并说它是让买家犹豫的主要原因之一"}, {"kind": "补充", "text": "头部竞品用 TPE 防滑底、不靠背胶，而且都能机洗", "why": "Alexa 点名 COSY HOMEER（4.7 星，8,728 条评论，$76.49）和 MBIGM（4.6 星，$41.99）。粘性和不能洗正是本品的两个短板，适合作为下一步竞品分析的对象"}, {"kind": "补充", "text": "Alexa 看到的价格是 $69.98，比 10-20 拉数据时的 $59.99 高 10 美元", "why": "它在「值不值」「品牌口碑」里都把价格偏高当成扣分项"}, {"kind": "有误", "text": "它说标题写了「Washable」，实际标题里没有；它还说尺寸没人抱怨，但评论里有 1 条说太小、要退货", "why": "Alexa 的归纳会出错。引用它的话之前，要和评论原文、页面核对"}], "price": "$69.98", "source": "apinsight 2.1.0 · 2026-10-27 采集 · 24 道核心题"}, "imageData": "data:image/jpeg;base64,/   const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const pct=n=>Math.round(n/N*100)+'%';
  const day=t=>new Date(t).toISOString().slice(0,10);
  const Q=q=>q.map(([en,zh,src])=>`<div class="quote"><span class="en">${en}</span><span class="zh">${zh}</span><span class="src">${src}</span></div>`).join('');
  const neg=U.filter(r=>r.star<=3).length;
  document.title=`${P.name} · VOC 现场分析`;
  const probs=D.problems.slice().sort((a,b)=>b.count-a.count), main=probs.filter(p=>p.count>=2), small=probs.filter(p=>p.count<2);
  const praises=D.praises.slice().sort((a,b)=>b.count-a.count);
  const maxS=Math.max(...Object.values(D.stars));
  const C=D.calc||{}, S0=D.journey||[], sgn=v=>(v>0?'+':'')+v, tone=v=>v>=20?'good':v<=-20?'bad':'warn';
  let html=`
  <div class="top"><span><span class="chip info">现场分析</span> 数据来自${D.pulled.source}，${D.pulled.at} 拉取，调用 ${D.pulled.calls} 次</span><span>分析对象：公开在售的 Amazon 商品</span></div>
  <div class="panel">
    <div class="hero"><img src="${D.imageData||P.image}" alt="${P.name}商品图" onerror="this.remove()">
      <div><h1>${P.name}</h1><p class="en">${P.title}</p>
      <div class="stats"><span>品牌 <b>${P.brand}</b></span><span>ASIN <b>${P.asin}</b></span><span>父 ASIN <b>${P.parent}</b></span><span>价格 <b>$${P.price}</b></span><span>评分 <b>${P.rating}</b>（${P.ratings} 个）</span><span>${P.bsr}</span><span>上架 <b>${P.launched}</b></span><span>${P.variants.length} 个款式：${P.variants.join(' / ')}</span></div></div></div>
    <div class="summary">${D.summary}</div>
    ${D.insight?`<div class="insight">${D.insight}</div>`:''}
  </div>
  <div class="kpis">
    <div class="kpi"><span>拿到的评论</span><b>${D.pulled.total}</b><small>去掉送测 ${D.pulled.vine} 条，分析 ${N} 条</small></div>
    <div class="kpi"><span>差评占比（1–3 星）</span><b>${pct(neg)}</b><small>${neg} / ${N} 条</small></div>
    <div class="kpi"><span>最大的问题</span><b style="font-size:18px;font-family:var(--font-body)">${probs[0].name}</b><small>${probs[0].count} 条 · ${pct(probs[0].count)}</small></div>
    <div class="kpi"><span>用户最喜欢</span><b style="font-size:18px;font-family:var(--font-body)">${praises[0].name}</b><small>${praises[0].count} 条 · ${pct(praises[0].count)}</small></div>
  </div>
  ${C.pareto?`<div class="panel"><div><h2>先改哪几件：${C.pareto.coreCount} 个问题占了 ${C.pareto.coreShare}% 的抱怨</h2><p class="sub">把问题按提到的人数从多到少排，再算累计占比，前面这几件就是二八里的「二」。最后一列是提到这个问题的人平均给几星（全部评论平均 ${C.pareto.avgStarAll} 星）</p></div>
    <div class="tablewrap"><table style="min-width:640px"><thead><tr><th>问题</th><th>提到的人</th><th style="width:30%">占全部抱怨</th><th>累计</th><th>平均星级</th></tr></thead><tbody>${C.pareto.rows.map(r=>`<tr${r.core?'':' style="color:var(--muted)"'}><td>${r.core?'<span class="chip bad">先改</span> ':''}${r.name}</td><td class="num">${r.count} 条 · ${r.ofReviews}%</td><td><span class="bar"><i style="width:${r.ofComplaints}%;background:${r.core?'var(--bad)':'var(--faint)'}"></i></span></td><td class="num">${r.cum}%</td><td class="num">${r.avgStar}★</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="row2">
    <div class="panel"><div><h2>最该改的</h2><p class="sub">按提到的人数排。一条评论可能说了好几件事</p></div>
      ${main.map((p,i)=>`<div class="item"><div class="ih"><span class="rank">${i+1}</span><div><b>${p.name}</b><small>${p.stage} · 该谁改：${p.owner}${p.hidden?` · <span style="color:var(--warn);font-weight:700">${p.hidden} 条来自 4–5 星</span>`:''}</small></div><span class="bar"><i style="width:${p.count/probs[0].count*100}%;background:var(--bad)"></i></span><span class="num" style="text-align:right">${p.count} 条</span></div>
        <div class="fix">建议：${p.fix}</div>
        <details${i===0?' open':''}><summary>看用户原话</summary><div style="display:grid;gap:8px">${Q(p.quotes)}</div></details></div>`).join('')}
      ${small.length?`<div class="item"><b style="font-size:13px">只有 1 条，先盯住</b>${small.map(p=>`<div class="act"><span class="chip ${p.risk?'bad':'plain'}">${p.risk?'风险':'少量'}</span><div><b>${p.name}</b><p>${p.fix}</p>${p.quotes.length?`<p>“${p.quotes[0][1]}”</p>`:''}</div></div>`).join('')}</div>`:''}
    </div>
    <div style="display:grid;gap:18px;align-content:start">
      <div class="panel"><div><h2>用户最喜欢的</h2><p class="sub">可以直接用在主图和五点里</p></div>
        ${praises.map(p=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px"><b>${p.name}</b><span class="num hint">${p.count} 条</span></div><span class="sub">怎么用：${p.use}</span>${p.quotes.length?Q(p.quotes.slice(0,1)):''}</div>`).join('')}
      </div>
      <div class="panel"><h2>星级分布</h2><div class="stars">${[5,4,3,2,1].map(s=>`<div class="srow"><span>${s}★</span><span class="bar"><i style="width:${D.stars[s]/maxS*100}%;background:${s>=4?'var(--good)':s==3?'var(--warn)':'var(--bad)'}"></i></span><span class="num" style="text-align:right">${D.stars[s]}</span></div>`).join('')}</div><p class="hint" style="margin:0">不含送测评论</p></div>
    </div>
  </div>
  ${C.drill?`<div class="panel"><div><h2>按款式看</h2><p class="sub">${C.drill.hot.length?'下面这些问题集中在某一个款式，只改这个款式就行':'没有集中在某一个款式的问题，要改就是全线改'}。评论少于 5 条的款式只列出来，不下结论${C.drill.unlabeled?`；另有 ${C.drill.unlabeled} 条评论没标款式`:''}</p></div>
    ${C.drill.hot.map(h=>`<div class="insight"><b>「${h.name}」集中在 ${h.sku}</b>：这个款式里 ${h.skuShare}% 的评论在说，全部评论里只有 ${h.allShare}%（${h.count} / ${h.total} 条来自这个款式）</div>`).join('')}
    <div class="tablewrap"><table style="min-width:600px"><thead><tr><th>款式</th><th>评论</th><th>平均星级</th><th>差评占比</th><th>这个款式最多人说的问题</th></tr></thead><tbody>${C.drill.skus.map(k=>`<tr${k.small?' style="color:var(--muted)"':''}><td>${k.sku}${k.small?' <span class="chip plain">样本少</span>':''}</td><td class="num">${k.n} 条 · ${k.share}%</td><td class="num">${k.avgStar}★</td><td class="num">${k.negShare}%</td><td>${k.top.map(t=>`${t.name} <span class="num hint">${t.count} 条</span>`).join('；')||'<span class="hint">—</span>'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="panel"><div><h2>用户旅程</h2><p class="sub">每个点是一个具体时刻，往上是满意，往下是不满意，点越大说的人越多。${S0.some(s=>s.score!=null)?'蓝线是旅程线：把每一段的满意度连起来，看体验在哪一段掉下去。满意度 = 这一段说好的人减说不好的人，除以提到这一段的人，从 −100 到 +100':''}</p></div><div class="chart" id="journey"></div></div>
  ${C.compare?`<div class="panel"><div><h2>和竞品比</h2><p class="sub">同一套问题分类下，每个问题被多少比例的评论提到。高出竞品平均一半以上、且至少 3 条，标为短板或卖点</p></div>
    <div class="stats"><span>我：<b>${C.compare.mine.n}</b> 条 · 平均 <b>${C.compare.mine.avgStar}</b>★ · 差评 <b>${C.compare.mine.negShare}%</b></span>${C.compare.comps.map(c=>`<span>${c.brand||c.name}（${c.asin}）：<b>${c.n}</b> 条 · 平均 <b>${c.avgStar}</b>★ · 差评 <b>${c.negShare}%</b></span>`).join('')}</div>
    <div class="tablewrap"><table style="min-width:640px"><thead><tr><th>用户在说</th><th>我</th>${C.compare.comps.map(c=>`<th>${c.brand||c.name}</th>`).join('')}<th>竞品平均</th><th></th></tr></thead><tbody>${C.compare.rows.map(r=>`<tr><td><span class="chip ${r.kind==='neg'?'bad':'good'}">${r.kind==='neg'?'抱怨':'好评'}</span> ${r.name}</td><td class="num"${r.verdict==='短板'||r.verdict==='不如竞品'?' style="color:var(--bad);font-weight:700"':''}>${r.mine}%</td>${r.comps.map(v=>`<td class="num">${v==null?'<span class="hint">没这一类</span>':v+'%'}</td>`).join('')}<td class="num">${r.avg==null?'—':r.avg+'%'}</td><td>${r.verdict?`<span class="chip ${r.verdict==='短板'||r.verdict==='不如竞品'?'bad':'good'}">${r.verdict}</span>`:''}</td></tr>`).join('')}</tbody></table></div>
    ${C.compare.compOnlyTags.length?`<p class="hint" style="margin:0">只有竞品被说到的：${C.compare.compOnlyTags.join('、')}</p>`:''}</div>`:''}
  ${D.alexa&&D.alexa.items&&D.alexa.items.length?(()=>{const A=D.alexa, X=C.alexa||{}, K={'一致':'good','补充':'info','有误':'bad'};
    return `<div class="panel"><div><h2>Alexa 怎么跟买家说</h2><p class="sub">买家在商品页问亚马逊 Alexa（原 Rufus）时，它给出的回答。这是平台对评论的 AI 归纳，不是买家原话，不计入上面任何条数，只用来对照。${A.source?`来源：${A.source}`:''}</p></div>
    ${X.n?`<div class="stats"><span>问了 <b>${X.n}</b> 题</span><span>评论里排前 ${X.topN} 的问题，Alexa 提到了 <b>${X.topCovered}</b> 个</span>${X.missed&&X.missed.length?`<span>评论里有、它没提：<b>${X.missed.join('、')}</b></span>`:''}${A.price?`<span>Alexa 看到的价格 <b>${A.price}</b></span>`:''}</div>`:''}
    ${A.findings&&A.findings.length?`<div class="acts">${A.findings.map(f=>`<div class="act"><span class="chip ${K[f.kind]||'plain'}">${f.kind}</span><div><b>${f.text}</b>${f.why?`<p>${f.why}</p>`:''}</div></div>`).join('')}</div>`:''}
    ${X.rows&&X.rows.length?`<div class="tablewrap"><table style="min-width:520px"><thead><tr><th>评论里的问题</th><th>评论里提到</th><th>Alexa 回答里提到</th></tr></thead><tbody>${X.rows.map(r=>`<tr><td>${r.tag}</td><td class="num">${r.reviews} 条 · ${r.ofReviews}%</td><td>${r.alexa?`<span class="chip good">${r.alexa} 题提到</span>`:'<span class="chip plain">没提</span>'}</td></tr>`).join('')}</tbody></table></div>`:''}
    <details><summary>看全部 ${A.items.length} 条问答</summary><div style="display:grid;gap:10px">${A.items.map(i=>`<div class="quote"><span class="src">${i.category||''}${i.stance?` · ${i.stance}`:''}</span><span class="en"><b>${i.q}</b></span><span class="zh">${i.zh||'（还没读）'}</span><details><summary>英文原文</summary><span class="en">${i.answer}</span></details></div>`).join('')}</div></details></div>`;})():''}
  <div class="panel"><h2>建议的行动</h2><div class="acts">${main.slice(0,3).map((p,i)=>`<div class="act"><span class="chip ${i===0?'bad':'warn'}">${i===0?'先做':'接着做'}</span><div><b>${p.name}：${p.fix}</b><p>该谁改：${p.owner} · 看什么数：评论里提「${p.name}」的占比，现在 ${pct(p.count)}</p></div></div>`).join('')}
    <div class="act"><span class="chip good">用好评</span><div><b>${praises.map(p=>p.use).slice(0,2).join('；')}</b><p>依据：${praises.slice(0,2).map(p=>`「${p.name}」${p.count} 条`).join('，')}</p></div></div></div></div>
  <div class="panel"><div><h2>全部原话</h2><p class="sub">点标签筛选</p></div><div class="filters" id="tagf"></div><div class="tablewrap"><table id="rv"></table></div></div>
  <p class="foot">${P.brand} 是公开在售的 Amazon 品牌，这里只用于演示分析流程。评论不保留买家名字。</p>`;
  document.getElementById('app').innerHTML=html;

  /* 旅程图 */
  const S=D.journey, W=960,H=400,L=20,R=20,T=40,B=60,n=S.length,colW=(W-L-R)/n, mid=T+(H-T-B)/2, half=(H-T-B)/2-14;
  const maxC=Math.max(...S.flatMap(s=>[...s.pos,...s.neg].map(x=>x[1])),1);
  const off=c=>14+Math.sqrt(c)/Math.sqrt(maxC)*(half-14), cx=i=>L+colW*(i+.5);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="用户旅程：每个阶段满意和不满意的时刻">`;
  for(let i=1;i<n;i++) s+=`<line x1="${L+colW*i}" x2="${L+colW*i}" y1="${T}" y2="${H-B}" stroke="${css('--line')}" stroke-dasharray="2 4"/>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" stroke="${css('--warn')}" stroke-dasharray="5 4" stroke-width="1.4"/><text x="${L+4}" y="${mid-6}" font-size="11" fill="${css('--warn')}">情绪基线</text>`;
  /* 旅程线：每一段的满意度（−100 到 +100）连起来，画在时刻点后面 */
  const sy=v=>mid-v/100*half, segs=[[]];
  S.forEach((st,i)=>{ if(st.score==null){ if(segs[segs.length-1].length) segs.push([]); } else segs[segs.length-1].push([cx(i),sy(st.score),st.score]); });
  segs.filter(g=>g.length).forEach(g=>{ const pts=g.map(p=>p[0]+','+p[1]).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="${css('--accent')}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".12"/>`;
    s+=`<polyline class="jline" pathLength="1" points="${pts}" fill="none" stroke="${css('--accent')}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    g.forEach(([x,y,v])=>{ s+=`<circle cx="${x}" cy="${y}" r="5" fill="${css('--surface')}" stroke="${css('--accent')}" stroke-width="2.4"><title>满意度 ${sgn(v)}</title></circle>`; }); });
  S.forEach((st,i)=>{
    const place=(arr,sign,color)=>{ const it=arr.filter(x=>x[1]>0).map(([tx,c])=>({tx,c,o:off(c)})).sort((a,b)=>a.o-b.o);
      it.forEach((x,j)=>{ x.o=j===0?Math.max(x.o,14):Math.max(x.o,it[j-1].o+17); });
      it.forEach((x,j)=>{ const r=3+Math.sqrt(x.c)*1.1, X=cx(i)-colW*.32+(j%2)*6, Y=mid-sign*x.o;
        s+=`<g style="animation:rise .38s var(--ease) ${i*80+150}ms both"><circle cx="${X}" cy="${Y}" r="${r}" fill="${color}" fill-opacity=".9"/><text x="${X+r+5}" y="${Y+4}" font-size="11.5" font-weight="700" fill="${color}" style="paint-order:stroke;stroke:${css('--surface')};stroke-width:3.5px;stroke-linejoin:round">${x.tx} ${x.c}</text></g>`; }); };
    place(st.pos,1,css('--good')); place(st.neg,-1,css('--bad'));
    s+=`<text x="${cx(i)}" y="${H-B+24}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${css('--ink')}">${st.n}</text>`;
    if(st.score!=null) s+=`<text x="${cx(i)}" y="${H-B+44}" text-anchor="middle" font-size="12" font-weight="700" fill="${css('--'+tone(st.score))}">满意度 ${sgn(st.score)}<tspan font-weight="400" fill="${css('--faint')}">（${st.talked} 人）</tspan></text>`;
  });
  document.getElementById('journey').innerHTML=s+'</svg>';

  /* 原话表 */
  const tags=[...D.tagsNeg,...D.tagsPos].filter(t=>U.some(r=>r.tags.includes(t)));
  let f='全部';
  function draw(){
    document.getElementById('tagf').innerHTML=['全部',...tags].map(t=>`<button class="fchip" type="button" data-t="${t}" aria-pressed="${f===t}">${t} <span class="num">${t==='全部'?N:U.filter(r=>r.tags.includes(t)).length}</span></button>`).join('');
    const rows=U.filter(r=>f==='全部'||r.tags.includes(f));
    document.getElementById('rv').innerHTML=`<thead><tr><th>星级</th><th>日期</th><th>款式</th><th>原话</th><th>标签</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="num">${r.star}★</td><td class="num">${day(r.t)}</td><td>${r.sku||'<span class="hint">未标</span>'}</td><td>${r.en}<span class="zh">${r.zh}</span></td><td><div class="tags">${r.tags.map(t=>`<span class="chip ${D.tagsNeg.includes(t)?'bad':'good'}">${t}</span>`).join('')}</div></td></tr>`).join('')}</tbody>`;
  }
  document.getElementById('tagf').addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return; f=b.dataset.t; draw(); });
  draw();
})();
</script>
